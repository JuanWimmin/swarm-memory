name: Install test (clean machine via pear install)

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'pear:// link to install'
        required: true
        default: 'pear://ino4ymu381ouhyo14u6sg5ursbto4irt4n5mhhzjkk8a7mwgd6iy'
      ota_wait_seconds:
        description: 'Keep the installed binary running (updates ON) this many seconds to observe an OTA update'
        required: false
        default: '0'

permissions:
  contents: read

jobs:
  install:
    name: pear install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pear CLI
        shell: pwsh
        run: |
          npm i -g pear
          pear versions

      - name: pear install (clean machine)
        shell: pwsh
        run: |
          $dst = Join-Path $PWD 'installed'
          New-Item -ItemType Directory -Force $dst | Out-Null
          $sw = [Diagnostics.Stopwatch]::StartNew()
          for ($i = 1; $i -le 6; $i++) {
            pear install --timeout 120 --to $dst "${{ github.event.inputs.link }}"
            if (Get-ChildItem -Recurse -Filter swarm-memory*.exe $dst -ErrorAction SilentlyContinue) { break }
            Write-Output "retry $i"; Start-Sleep -Seconds 20
          }
          Write-Output "elapsed=$([int]$sw.Elapsed.TotalSeconds)s"
          Get-ChildItem -Recurse $dst | Select-Object FullName,Length | Format-Table -AutoSize
          $exe = Get-ChildItem -Recurse -Filter 'swarm-memory*.exe' $dst | Select-Object -First 1
          if (-not $exe) { throw 'swarm-memory executable not found after install' }
          Write-Output "EXE=$($exe.FullName)"
          "EXE=$($exe.FullName)" | Out-File -Append $env:GITHUB_ENV
          & $exe.FullName --version

      - name: Run installed binary with OTA updates enabled
        if: ${{ github.event.inputs.ota_wait_seconds != '0' }}
        shell: pwsh
        run: |
          $store = Join-Path $PWD 'store'
          $p = Start-Process -FilePath $env:EXE -ArgumentList @('--storage', $store) -NoNewWindow -PassThru -RedirectStandardOutput out.log -RedirectStandardError err.log
          $deadline = (Get-Date).AddSeconds([int]'${{ github.event.inputs.ota_wait_seconds }}')
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 15
            if (Select-String -Path out.log -Pattern 'applied update' -Quiet) { Write-Output 'OTA applied — stopping early'; break }
            if ($p.HasExited) { Write-Output "process exited code $($p.ExitCode)"; break }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Output '=== stdout ==='; Get-Content out.log
          Write-Output '=== stderr ==='; Get-Content err.log -ErrorAction SilentlyContinue
          & $env:EXE --version
          if (-not (Select-String -Path out.log -Pattern 'applied update' -Quiet)) { Write-Output '::warning::No OTA update observed in the window' }
